<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gateway Subs — Catering Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0F172B;
      --steel:  #496E9B;
      --frost:  #EBEEEF;
      --white:  #ffffff;
      --accent: #6B9FD4;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--frost);
      overflow: hidden;
    }

    /* ── subtle grid texture ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(73,110,155,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(73,110,155,.08) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── glow blob ── */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(73,110,155,.18) 0%, transparent 70%);
      top: -150px; left: -150px;
      pointer-events: none;
      z-index: 0;
      animation: blobDrift 12s ease-in-out infinite alternate;
    }

    @keyframes blobDrift {
      from { transform: translate(0,0); }
      to   { transform: translate(80px, 60px); }
    }

    /* ── layout ── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0 24px 24px;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 18px;
      border-bottom: 1px solid rgba(73,110,155,.35);
      animation: fadeDown .6s ease both;
    }

    @keyframes fadeDown {
      from { opacity:0; transform: translateY(-16px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-mark {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--steel);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--white);
      letter-spacing: -1px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 4px 20px rgba(73,110,155,.4);
    }

    .brand-text h1 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      letter-spacing: -.3px;
    }

    .brand-text p {
      font-size: 11px;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(73,110,155,.18);
      border: 1px solid rgba(73,110,155,.4);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    /* ── calendar container ── */
    .cal-wrap {
      flex: 1;
      margin-top: 20px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(73,110,155,.3);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04),
        0 8px 40px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.06);
      animation: fadeUp .7s .15s ease both;
      position: relative;
    }

    @keyframes fadeUp {
      from { opacity:0; transform: translateY(20px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* loading shimmer behind iframe */
    .cal-wrap::before {
      content: 'Loading calendar…';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: rgba(235,238,239,.3);
      letter-spacing: 1px;
      background: var(--navy);
      z-index: 0;
    }

    iframe {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── footer ── */
    footer {
      text-align: center;
      padding-top: 10px;
      font-size: 11px;
      color: rgba(235,238,239,.3);
      letter-spacing: .5px;
      animation: fadeUp .7s .3s ease both;
    }

    footer span {
      color: var(--steel);
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="logo-mark">GS</div>
        <div class="brand-text">
          <h1>Gateway Subs</h1>
          <p>Catering Calendar</p>
        </div>
      </div>
      <div class="header-right">
        <div class="live-badge">
          <div class="live-dot"></div>
          Live
        </div>
      </div>
    </header>

    <div class="cal-wrap">
      <iframe
        src="https://calendar.google.com/calendar/embed?src=664f45bb2acc2f1ded74d6a90f83fbd0a980bd46f732cc825b86160b00af883f%40group.calendar.google.com&ctz=America%2FNew_York&bgcolor=%230F172B&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0"
        title="Gateway Subs Catering Calendar"
        allowfullscreen
      ></iframe>
    </div>

    <footer>
      Gateway Subs &nbsp;·&nbsp; <span>Tampa Bay / St. Petersburg, FL</span> &nbsp;·&nbsp; All catering events
    </footer>
  </div>
</body>
</html>
