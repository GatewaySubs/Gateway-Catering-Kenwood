<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gateway Subs Kenwood — Catering Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy:#0F172B; --steel:#496E9B; --frost:#EBEEEF; --white:#ffffff; --accent:#6B9FD4; }
    html, body { height:100%; font-family:'DM Sans',sans-serif; background:var(--navy); color:var(--frost); overflow:hidden; }
    body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(73,110,155,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(73,110,155,.08) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
    body::after { content:''; position:fixed; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle,rgba(73,110,155,.18) 0%,transparent 70%); top:-150px; left:-150px; pointer-events:none; z-index:0; animation:blobDrift 12s ease-in-out infinite alternate; }
    @keyframes blobDrift { from{transform:translate(0,0)} to{transform:translate(80px,60px)} }
    .page { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; padding:0 24px 24px; }
    header { display:flex; align-items:center; justify-content:space-between; padding:20px 0 18px; border-bottom:1px solid rgba(73,110,155,.35); animation:fadeDown .6s ease both; }
    @keyframes fadeDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
    .brand { display:flex; align-items:center; gap:14px; }
    .logo-mark { width:42px; height:42px; border-radius:10px; background:var(--steel); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-size:22px; color:var(--white); letter-spacing:-1px; box-shadow:0 0 0 1px rgba(255,255,255,.1),0 4px 20px rgba(73,110,155,.4); }
    .brand-text h1 { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--white); line-height:1; letter-spacing:-.3px; }
    .brand-text p { font-size:11px; font-weight:300; color:var(--accent); letter-spacing:2.5px; text-transform:uppercase; margin-top:3px; }
    .header-right { display:flex; align-items:center; gap:10px; }
    .location-badge { background:rgba(73,110,155,.18); border:1px solid rgba(73,110,155,.4); border-radius:20px; padding:5px 14px; font-size:11px; font-weight:500; color:var(--frost); letter-spacing:1px; text-transform:uppercase; }
    .live-badge { display:flex; align-items:center; gap:6px; background:rgba(73,110,155,.18); border:1px solid rgba(73,110,155,.4); border-radius:20px; padding:5px 12px; font-size:11px; font-weight:500; color:var(--accent); letter-spacing:1px; text-transform:uppercase; }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#4ade80; box-shadow:0 0 6px #4ade80; animation:pulse 2s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .view-toggle { display:flex; gap:8px; margin:14px 0 10px; }
    .view-btn { padding:6px 16px; border-radius:20px; border:1px solid rgba(73,110,155,.4); background:transparent; color:var(--frost); font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; transition:all .2s; }
    .view-btn.active { background:var(--steel); border-color:var(--steel); color:var(--white); }
    .view-btn:hover:not(.active) { background:rgba(73,110,155,.15); }
    .cal-container { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .month-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .month-nav h2 { font-family:'Playfair Display',serif; font-size:17px; color:var(--white); }
    .nav-btn { background:rgba(73,110,155,.2); border:1px solid rgba(73,110,155,.3); color:var(--frost); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; transition:all .2s; }
    .nav-btn:hover { background:var(--steel); }
    .day-headers { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:3px; }
    .day-header { text-align:center; font-size:10px; font-weight:500; color:var(--accent); letter-spacing:1px; text-transform:uppercase; padding:3px 0; }
    .days-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; flex:1; }
    .day-cell { background:rgba(73,110,155,.06); border:1px solid rgba(73,110,155,.12); border-radius:8px; padding:4px; cursor:pointer; transition:all .2s; display:flex; flex-direction:column; overflow:hidden; }
    .day-cell:hover { background:rgba(73,110,155,.15); border-color:rgba(73,110,155,.4); }
    .day-cell.other-month { opacity:.25; }
    .day-cell.today { border-color:var(--steel); background:rgba(73,110,155,.15); }
    .day-cell.today .day-num { background:var(--steel); color:var(--white); border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
    .day-num { font-size:11px; font-weight:500; color:var(--frost); margin-bottom:2px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
    .event-chip { background:var(--steel); border-radius:3px; padding:1px 4px; font-size:9px; color:var(--white); margin-top:1px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer; }
    .event-chip:hover { background:var(--accent); }
    .more-events { font-size:9px; color:var(--accent); margin-top:1px; padding:0 2px; }
    .list-view { flex:1; overflow-y:auto; padding-right:4px; }
    .list-view::-webkit-scrollbar { width:4px; }
    .list-view::-webkit-scrollbar-thumb { background:rgba(73,110,155,.4); border-radius:2px; }
    .list-date-header { font-size:11px; font-weight:500; color:var(--accent); letter-spacing:2px; text-transform:uppercase; padding:12px 0 6px; border-bottom:1px solid rgba(73,110,155,.2); margin-bottom:6px; }
    .list-event { background:rgba(73,110,155,.1); border:1px solid rgba(73,110,155,.2); border-radius:10px; padding:10px 14px; margin-bottom:6px; cursor:pointer; transition:all .2s; display:flex; align-items:flex-start; gap:12px; }
    .list-event:hover { background:rgba(73,110,155,.2); border-color:var(--steel); transform:translateX(2px); }
    .list-event-time { font-size:11px; color:var(--accent); min-width:70px; padding-top:1px; }
    .list-event-name { font-size:13px; color:var(--white); font-weight:500; }
    .list-event-desc { font-size:11px; color:rgba(235,238,239,.5); margin-top:2px; }
    .no-events { text-align:center; padding:40px 20px; color:rgba(235,238,239,.3); font-size:13px; }
    .loading { display:flex; align-items:center; justify-content:center; flex:1; flex-direction:column; gap:12px; }
    .spinner { width:32px; height:32px; border:2px solid rgba(73,110,155,.3); border-top-color:var(--steel); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .loading-text { font-size:12px; color:rgba(235,238,239,.3); letter-spacing:1px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
    .modal-overlay.hidden { display:none !important; }
    .modal { background:#1a2744; border:1px solid rgba(73,110,155,.4); border-radius:20px; padding:28px; max-width:480px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.6); position:relative; max-height:80vh; overflow-y:auto; }
    .modal-close { position:absolute; top:16px; right:16px; background:rgba(73,110,155,.2); border:1px solid rgba(73,110,155,.3); color:var(--frost); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; transition:all .2s; }
    .modal-close:hover { background:var(--steel); }
    .modal-tag { font-size:10px; font-weight:500; color:var(--accent); letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
    .modal-title { font-family:'Playfair Display',serif; font-size:22px; color:var(--white); margin-bottom:16px; line-height:1.3; }
    .modal-detail { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
    .modal-detail-icon { font-size:16px; margin-top:1px; }
    .modal-detail-label { font-size:10px; color:var(--accent); letter-spacing:1px; text-transform:uppercase; margin-bottom:2px; }
    .modal-detail-text { font-size:13px; color:var(--frost); line-height:1.5; }
    .modal-desc { background:rgba(73,110,155,.1); border-radius:10px; padding:12px; margin-top:8px; font-size:12px; color:rgba(235,238,239,.7); line-height:1.6; white-space:pre-wrap; }
    .attachments-section { margin-top:14px; }
    .attachments-label { font-size:10px; color:var(--accent); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .attachment-link { display:flex; align-items:center; gap:8px; background:rgba(73,110,155,.12); border:1px solid rgba(73,110,155,.25); border-radius:8px; padding:8px 12px; margin-bottom:6px; text-decoration:none; color:var(--frost); transition:all .2s; }
    .attachment-link:hover { background:rgba(73,110,155,.25); border-color:var(--steel); color:var(--white); }
    .attachment-icon { font-size:16px; flex-shrink:0; }
    .attachment-name { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    footer { text-align:center; padding-top:10px; font-size:11px; color:rgba(235,238,239,.3); letter-spacing:.5px; }
    footer span { color:var(--steel); }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">
      <div class="logo-mark">GS</div>
      <div class="brand-text">
        <h1>Gateway Subs</h1>
        <p>Catering Calendar</p>
      </div>
    </div>
    <div class="header-right">
      <div class="location-badge">Kenwood</div>
      <div class="live-badge"><div class="live-dot"></div>Live</div>
    </div>
  </header>

  <div class="view-toggle">
    <button class="view-btn active" id="btnMonth" onclick="switchView('month')">Month</button>
    <button class="view-btn" id="btnList" onclick="switchView('list')">Upcoming</button>
  </div>

  <div class="cal-container">
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <div class="loading-text">Loading catering events…</div>
    </div>
    <div class="month-view hidden" id="monthView">
      <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <h2 id="monthLabel"></h2>
        <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
      <div class="day-headers">
        <div class="day-header">Sun</div><div class="day-header">Mon</div><div class="day-header">Tue</div>
        <div class="day-header">Wed</div><div class="day-header">Thu</div><div class="day-header">Fri</div>
        <div class="day-header">Sat</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>
    <div class="list-view hidden" id="listView"></div>
  </div>

  <footer>Gateway Subs &nbsp;·&nbsp; <span>St. Petersburg, FL</span> &nbsp;·&nbsp; All catering events</footer>
</div>

<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalBtn()">×</button>
    <div class="modal-tag">Catering Event</div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-detail">
      <div class="modal-detail-icon">📅</div>
      <div><div class="modal-detail-label">Date</div><div class="modal-detail-text" id="modalDate"></div></div>
    </div>
    <div class="modal-detail">
      <div class="modal-detail-icon">🕐</div>
      <div><div class="modal-detail-label">Time</div><div class="modal-detail-text" id="modalTime"></div></div>
    </div>
    <div id="modalDescWrap" class="hidden">
      <div class="modal-detail" style="margin-bottom:4px">
        <div class="modal-detail-icon">📋</div>
        <div><div class="modal-detail-label">Details</div></div>
      </div>
      <div class="modal-desc" id="modalDesc"></div>
    </div>
    <div id="modalAttachmentsWrap" class="hidden attachments-section">
      <div class="attachments-label">📎 Attachments</div>
      <div id="modalAttachments"></div>
    </div>
  </div>
</div>

<script>
const CALENDAR_ID = '664f45bb2acc2f1ded74d6a90f83fbd0a980bd46f732cc825b86160b00af883f@group.calendar.google.com';
const API_KEY = 'AIzaSyDpukszxx5DgnvW8LTTIZzM3a6dTuqcIEs';
let allEvents = [];
let currentMonth = new Date();
let currentView = 'month';

function getFileIcon(mimeType) {
  if (!mimeType) return '📄';
  if (mimeType.includes('pdf')) return '📄';
  if (mimeType.includes('sheet') || mimeType.includes('excel') || mimeType.includes('csv')) return '📊';
  if (mimeType.includes('document') || mimeType.includes('word')) return '📝';
  if (mimeType.includes('presentation') || mimeType.includes('powerpoint')) return '📊';
  if (mimeType.includes('image')) return '🖼️';
  if (mimeType.includes('video')) return '🎥';
  if (mimeType.includes('audio')) return '🎵';
  return '📎';
}

async function fetchEvents() {
  const calEncoded = encodeURIComponent(CALENDAR_ID);
  const now = new Date();
  const tMin = new Date(now.getFullYear(), now.getMonth() - 2, 1).toISOString();
  const tMax = new Date(now.getFullYear(), now.getMonth() + 4, 0).toISOString();
  const url = `https://www.googleapis.com/calendar/v3/calendars/${calEncoded}/events?key=${API_KEY}&timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=250&supportsAttachments=true`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('API error ' + resp.status);
    const data = await resp.json();
    allEvents = (data.items || []).map(e => {
      const start = e.start?.dateTime || e.start?.date || '';
      const allDay = !!e.start?.date && !e.start?.dateTime;
      const attachments = (e.attachments || []).map(a => ({
        title: a.title || 'Attachment',
        url: a.fileUrl || '',
        mimeType: a.mimeType || '',
        iconLink: a.iconLink || ''
      }));
      return {
        title: e.summary || 'Untitled Event',
        start,
        description: e.description || '',
        allDay,
        attachments
      };
    });
    document.getElementById('loadingState').classList.add('hidden');
    renderCurrentView();
  } catch(err) {
    document.getElementById('loadingState').innerHTML = '<div class="loading-text" style="color:rgba(235,238,239,.4);text-align:center">Could not load events.<br>Make sure the calendar is set to public.</div>';
  }
}

function switchView(v) {
  currentView = v;
  document.getElementById('btnMonth').classList.toggle('active', v==='month');
  document.getElementById('btnList').classList.toggle('active', v==='list');
  document.getElementById('monthView').classList.toggle('hidden', v!=='month');
  document.getElementById('listView').classList.toggle('hidden', v!=='list');
  renderCurrentView();
}

function renderCurrentView() {
  if (currentView==='month') renderMonth(); else renderList();
}

function getEventsForDay(date) {
  return allEvents.filter(e => {
    if (!e.start) return false;
    const s = new Date(e.allDay ? e.start+'T00:00:00' : e.start);
    return s.toDateString()===date.toDateString();
  });
}

function renderMonth() {
  document.getElementById('monthView').classList.remove('hidden');
  const y=currentMonth.getFullYear(), m=currentMonth.getMonth();
  document.getElementById('monthLabel').textContent = new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const grid=document.getElementById('daysGrid'); grid.innerHTML='';
  const firstDay=new Date(y,m,1).getDay(), daysInMonth=new Date(y,m+1,0).getDate(), daysInPrev=new Date(y,m,0).getDate();
  const today=new Date().toDateString(), total=Math.ceil((firstDay+daysInMonth)/7)*7;
  for(let i=0;i<total;i++){
    let dayNum,dateObj,otherMonth=false;
    if(i<firstDay){dayNum=daysInPrev-firstDay+i+1;dateObj=new Date(y,m-1,dayNum);otherMonth=true;}
    else if(i>=firstDay+daysInMonth){dayNum=i-firstDay-daysInMonth+1;dateObj=new Date(y,m+1,dayNum);otherMonth=true;}
    else{dayNum=i-firstDay+1;dateObj=new Date(y,m,dayNum);}
    const evs=getEventsForDay(dateObj), isToday=dateObj.toDateString()===today;
    const cell=document.createElement('div');
    cell.className='day-cell'+(otherMonth?' other-month':'')+(isToday?' today':'');
    let html=`<div class="day-num">${dayNum}</div>`;
    evs.slice(0,2).forEach(ev=>{
      const idx=allEvents.indexOf(ev);
      html+=`<div class="event-chip" onclick="openModalByIndex(event,${idx})">${ev.title}</div>`;
    });
    if(evs.length>2) html+=`<div class="more-events">+${evs.length-2} more</div>`;
    cell.innerHTML=html; grid.appendChild(cell);
  }
}

function renderList() {
  const listEl=document.getElementById('listView'); listEl.innerHTML='';
  const now=new Date(); now.setHours(0,0,0,0);
  const upcoming=allEvents.filter(e=>{
    if(!e.start) return false;
    return new Date(e.allDay?e.start+'T00:00:00':e.start)>=now;
  });
  if(!upcoming.length){listEl.innerHTML='<div class="no-events">No upcoming catering events</div>';return;}
  let lastDate='';
  upcoming.forEach(ev=>{
    const d=new Date(ev.allDay?ev.start+'T00:00:00':ev.start);
    const dateStr=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    if(dateStr!==lastDate){
      const hdr=document.createElement('div'); hdr.className='list-date-header'; hdr.textContent=dateStr; listEl.appendChild(hdr); lastDate=dateStr;
    }
    const timeStr=ev.allDay?'All Day':d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    const idx=allEvents.indexOf(ev);
    const item=document.createElement('div'); item.className='list-event';
    const hasAttachments = ev.attachments && ev.attachments.length > 0;
    item.innerHTML=`
      <div class="list-event-time">${timeStr}</div>
      <div style="flex:1">
        <div class="list-event-name">${ev.title}${hasAttachments ? ' 📎' : ''}</div>
        ${ev.description?`<div class="list-event-desc">${ev.description.substring(0,80)}${ev.description.length>80?'…':''}</div>`:''}
      </div>`;
    item.onclick=()=>openModalByIndex(null,idx); listEl.appendChild(item);
  });
}

function changeMonth(dir){currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+dir,1);renderMonth();}

function openModalByIndex(e,idx){
  if(e) e.stopPropagation();
  const ev=allEvents[idx]; if(!ev) return;
  const d=new Date(ev.allDay?ev.start+'T00:00:00':ev.start);
  document.getElementById('modalTitle').textContent=ev.title;
  document.getElementById('modalDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('modalTime').textContent=ev.allDay?'All Day':d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

  const descWrap=document.getElementById('modalDescWrap');
  if(ev.description&&ev.description.trim()){document.getElementById('modalDesc').textContent=ev.description;descWrap.classList.remove('hidden');}
  else{descWrap.classList.add('hidden');}

  const attWrap=document.getElementById('modalAttachmentsWrap');
  const attContainer=document.getElementById('modalAttachments');
  attContainer.innerHTML='';
  if(ev.attachments&&ev.attachments.length>0){
    ev.attachments.forEach(a=>{
      const icon=getFileIcon(a.mimeType);
      const link=document.createElement('a');
      link.className='attachment-link';
      link.href=a.url;
      link.target='_blank';
      link.rel='noopener noreferrer';
      link.innerHTML=`<span class="attachment-icon">${icon}</span><span class="attachment-name">${a.title}</span>`;
      attContainer.appendChild(link);
    });
    attWrap.classList.remove('hidden');
  } else {
    attWrap.classList.add('hidden');
  }

  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModalOutside(e){if(e.target.id==='modalOverlay')closeModalBtn();}
function closeModalBtn(){document.getElementById('modalOverlay').classList.add('hidden');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalBtn();});
fetchEvents();
</script>
</body>
</html>
